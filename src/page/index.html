<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ken</title>
		<link rel="stylesheet" href="tokens.css" />
		<link rel="stylesheet" href="page.css" />
		<link rel="stylesheet" href="home.css" />
		<script type="module" src="main.js"></script>
	</head>
	<body>
		<header class="top">
			<button type="button" class="brand" data-act="home" data-key="brand" aria-label="ken. Back to the project.">ken</button>
			<span class="project" id="project"></span>
			<div class="top-menu" id="menu"></div>
		</header>
		<div class="home" id="home">
			<div class="home-toolbar" id="home-toolbar"></div>
			<main class="home-canvas" id="home-canvas"></main>
			<div class="home-redraw" id="home-redraw"></div>
			<aside class="home-inspector" id="home-inspector" aria-label="What ken says about what you picked"></aside>
			<aside class="home-ask" id="home-ask" aria-label="Ask ken" hidden></aside>
		</div>
		<div class="page" id="page" hidden>
			<main class="chat">
				<div id="thread"></div>
				<form class="composer" id="ask" autocomplete="off">
					<label class="composer-label" for="question">Your question</label>
					<div class="composer-row">
						<textarea id="question" rows="1" placeholder="What changed, why was it done that way, how does a part work now?"></textarea>
						<button type="submit" class="primary" id="send">Ask</button>
					</div>
				</form>
				<div id="after"></div>
			</main>
			<aside class="panel" id="panel" aria-label="What ken checked"></aside>
		</div>
		<div id="tip" role="tooltip" hidden></div>
	</body>
</html>
